<!-- Load Ultraviolet core and config -->
<script src="https://gimkit0.github.io/uv-static/active/uv/uv.bundle.js" defer></script>
<script src="https://gimkit0.github.io/uv-static/active/uv/uv.config.js" defer></script>
<script src="https://gimkit0.github.io/uv-static/active/register.js"></script>

<script>
  async function loadIframe() {
        try {
            const disLink = "https://e.widgetbot.io/channels/1350263946405220432/1350263948540383245/";
            const encoded = __uv$config.encodeUrl(disLink);
            const proxiedUrl = __uv$config.prefix + encoded;
            
            document.addEventListener('keydown', function(event) {
                if (event.key.toLowerCase() === 'i' && event.shiftKey) {
                    console.log(proxiedUrl);
                }
            });
        } catch (err) {
            console.error("Failed to encode or bind key:", err);
        }
    }
</script>
<script>
  window.addEventListener("load", async () => {
        try {
            await registerSW();
            loadIframe();
        } catch (err) {
            console.error("Failed to register service worker:", err);
        }
    });
</script>
